[package]
name = "opentelemetry-wasi"
version = "0.27.1"
edition = "2021"

[dependencies]
anyhow = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }
wit-bindgen = "0.63.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
base64 = "0.23.1"


[workspace]
members = []

[workspace.dependencies]
anyhow = "1.0.104"
opentelemetry = { version = "0.32.0" }
opentelemetry_sdk = { version = "0.32.1", features = ["experimental_metrics_custom_reader", "logs"] }
opentelemetry-appender-tracing = "0.32.0"
tracing = "0.1.44"
tracing-opentelemetry = "0.33.0"
tracing-subscriber = "0.3.23"

[features]
# This enables OTel internal logging.
# For more information, see https://docs.rs/opentelemetry/latest/opentelemetry/#macros
internal-logs = ["opentelemetry/internal-logs"]
